[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linear-regression-model"
version = "0.1.0"
description = "Young African football player market-value regression, API, and Flutter summative project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "ipykernel>=6.29,<8",
    "joblib>=1.4,<2",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "scikit-learn==1.6.1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/football_value"]
